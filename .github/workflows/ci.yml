name: ci

# The reconstruction proof. A fresh GitHub runner IS a destroyed environment,
# so a clean checkout that reaches a working state proves the environment is
# a pure function of the repo — the one test that cannot be run from inside a
# live session, because a live session's Nix store is never actually empty.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main

      # Builds every check derivation: classification coverage, verify writing
      # nothing, a byte-for-byte synthetic backup/restore round trip, secret
      # exclusion, and docs-vs-manifest drift. All in the Nix sandbox, no
      # access to any real repository.
      - run: nix flake check --print-build-logs

  feature-test:
    # Post-merge only. install.sh's default FLAKEREF fetches
    # github:RayanJavan/claude-state at whatever is already on `main` — on a
    # PR that would test stale content, not the PR's own changes. flake-check
    # above tests the local checkout directly and is the real PR gate; this
    # job confirms the Feature mechanism (Nix bootstrap with no systemd,
    # postCreate/postStart) against what actually got published.
    if: github.ref == 'refs/heads/main'
    needs: flake-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      # A real Docker build against the flake at the commit under test — not
      # the synthetic sandbox above. This is the layer nix flake check cannot
      # reach: Nix bootstrap on a container with no systemd, and the feature's
      # own lifecycle hooks (postCreate/postStart) actually running.
      - name: devcontainer features test
        working-directory: .
        run: |
          devcontainer features test \
            -f claude-state \
            --skip-autogenerated \
            --base-image mcr.microsoft.com/devcontainers/base:bookworm
